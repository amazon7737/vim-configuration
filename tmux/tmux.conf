# ─────────────────────────────────────────────────────────────
# 이 설정은 두 가지 사용 방식을 모두 지원한다.
#   1) iTerm2 통합 모드: `agents` (= tmux -CC ...)  ← 평소 쓰는 방식
#      창 렌더링·스크롤·복사를 iTerm이 담당하므로 아래 마우스/copy-mode
#      설정은 거의 쓰이지 않는다.
#   2) 생 tmux: SSH로 원격 접속했을 때 등. 이때 마우스 설정이 살아난다.
# ─────────────────────────────────────────────────────────────

# 마우스 휠 스크롤 / 팬 클릭·리사이즈 허용
set -g mouse on

# 휠 한 틱당 스크롤 줄 수 (기본 5줄 → 2줄)
bind -T copy-mode WheelUpPane send -N2 -X scroll-up
bind -T copy-mode WheelDownPane send -N2 -X scroll-down
bind -T copy-mode-vi WheelUpPane send -N2 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N2 -X scroll-down

# 드래그 놓았을 때 맨 아래로 튕겨 내려가지 않고 그 자리에 머물기 (복사는 기본 그대로)
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe
# 스크롤백 버퍼 (기본 2000줄 → 50000줄)
set -g history-limit 50000

# 256색 + 트루컬러 (iTerm2)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── TUI 반응성 / 세션 안정성 ──────────────────────────────────
# ESC 입력 지연 제거 (Claude Code 같은 TUI에서 체감됨)
set -sg escape-time 10

# 클라이언트가 다 떨어져 나가도 세션을 유지 (재부팅 아닌 한 살아있게)
set -g destroy-unattached off

# 붙어 있던 세션이 사라져도 클라이언트를 끊지 않고 다른 세션으로 전환
set -g detach-on-destroy off

# 창 번호를 1부터 (0이 왼쪽 끝에 있는 게 헷갈려서)
set -g base-index 1
setw -g pane-base-index 1

# 창 하나 닫아도 번호 자동 재정렬
set -g renumber-windows on

# 창 제목을 현재 디렉터리 이름으로 (iTerm 탭 이름에 그대로 뜬다)
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# ── 플러그인 (tpm) ───────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# pane 내용까지 저장/복원
set -g @resurrect-capture-pane-contents 'on'
# claude 프로세스를 인자(--resume <id>)까지 포함해 복원 (~ 접두사가 "인자 포함")
set -g @resurrect-processes '"~claude"'

# 5분마다 자동 저장. 자동 복원은 일부러 끈다 —
# 서버 시작하자마자 에이전트 9개가 한꺼번에 뜨면 통제가 안 되므로
# 복원은 `Ctrl-b Ctrl-r` 수동으로 한다.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'

# tpm 초기화 — 반드시 파일 맨 마지막
run '~/.tmux/plugins/tpm/tpm'
